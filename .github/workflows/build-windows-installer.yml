name: Build MixCut Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-installer.yml'
      - '.github/scripts/build-installer-ci.ps1'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Align release metadata to upstream v0.16.4
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Upstream tag/release is v0.16.4, but its committed csproj/ISS metadata still says 0.15.0.
          # Change metadata only for packaging; no UI, prompt, workflow or feature logic is changed.
          $projPath = 'src\MixCut\MixCut.csproj'
          $proj = Get-Content $projPath -Raw
          $proj = $proj.Replace('<Version>0.15.0</Version>', '<Version>0.16.4</Version>')
          $proj = $proj.Replace('<AssemblyVersion>0.15.0.0</AssemblyVersion>', '<AssemblyVersion>0.16.4.0</AssemblyVersion>')
          $proj = $proj.Replace('<FileVersion>0.15.0.0</FileVersion>', '<FileVersion>0.16.4.0</FileVersion>')
          if ($proj -notmatch '<Version>0\.16\.4</Version>') { throw 'Failed to align MixCut.csproj version to 0.16.4' }
          Set-Content $projPath $proj -Encoding UTF8

          $ciPath = '.github\scripts\build-installer-ci.ps1'
          $ci = Get-Content $ciPath -Raw
          $ci = $ci.Replace('#define MyAppVersion "0.15.0"', '#define MyAppVersion "0.16.4"')
          $ci = $ci.Replace('OutputBaseFilename=MixCut-Setup-V1.0.1-SourceBaseline-win-x64', 'OutputBaseFilename=MixCut-Setup-v0.16.4-win-x64')
          if ($ci -notmatch '#define MyAppVersion "0\.16\.4"') { throw 'Failed to align installer version to 0.16.4' }
          Set-Content $ciPath $ci -Encoding UTF8

          Write-Host 'Package metadata aligned: MixCut v0.16.4'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin .NET 8 SDK
        shell: powershell
        run: |
          $sdk = (dotnet --list-sdks | ForEach-Object { ($_ -split ' ')[0] } | Where-Object { $_ -like '8.0.*' } | Sort-Object {[version]$_} -Descending | Select-Object -First 1)
          if (-not $sdk) { throw 'No .NET 8 SDK found' }
          $json = @{ sdk = @{ version = $sdk; rollForward = 'latestPatch' } } | ConvertTo-Json -Depth 3
          Set-Content global.json $json -Encoding UTF8
          dotnet --version

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup and Ninja
        shell: powershell
        run: |
          choco install innosetup ninja -y --no-progress
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { throw 'Inno Setup missing' }
          cmake --version
          ninja --version

      - name: Build original-source Windows installer
        shell: powershell
        run: .\.github\scripts\build-installer-ci.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MixCut-Windows-v0.16.4-Installer
          path: installer/out-ci/*.exe
          if-no-files-found: error
          retention-days: 14
