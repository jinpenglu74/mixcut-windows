name: Ecom Taobao Shop Live Probe

on:
  push:
    branches:
      - ci/ecom-shop-live-probe-20260911

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium --no-shell
      - name: Probe real Taobao shop
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          @'
          import asyncio, re
          from playwright.async_api import async_playwright

          URL = 'https://shop66052862.taobao.com/category.htm?search=y&pageNo=1'

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, channel='chromium')
                  context = await browser.new_context(locale='zh-CN', viewport={'width': 1440, 'height': 1000})
                  page = await context.new_page()
                  response = await page.goto(URL, wait_until='domcontentloaded', timeout=60000)
                  await page.wait_for_timeout(5000)
                  final_url = page.url
                  title = await page.title()
                  html = await page.content()
                  print('HTTP', response.status if response else None)
                  print('FINAL_URL', final_url)
                  print('TITLE', title)
                  lower = final_url.lower()
                  if 'login.taobao.com' in lower or 'passport.taobao.com' in lower:
                      print('LIVE_GATE=PASS_AUTH_REQUIRED')
                      await browser.close()
                      return
                  if 'security.taobao.com' in lower or 'punish' in lower or '访问验证' in title or '安全验证' in title:
                      print('LIVE_GATE=PASS_VERIFICATION_REQUIRED')
                      await browser.close()
                      return
                  hrefs = await page.locator('a[href]').evaluate_all("els => els.map(a => a.href || a.getAttribute('href') || '').filter(Boolean)")
                  ids = set()
                  for href in hrefs:
                      match = re.search(r'[?&](?:id|itemId|itemid)=(\\d{6,})', href, re.I)
                      if match:
                          ids.add(match.group(1))
                  ids.update(re.findall(r'(?i)(?:itemId|item_id|itemid|auctionId|nid)[\\"\\\'=: ]{1,12}(\\d{6,})', html))
                  print('LIVE_PRODUCT_IDS', len(ids), sorted(ids)[:20])
                  if not ids:
                      raise RuntimeError('LIVE_GATE=FAIL_READY_PAGE_ZERO_PRODUCTS')
                  print('LIVE_GATE=PASS_READY_WITH_PRODUCTS')
                  await browser.close()

          asyncio.run(main())
          '@ | Set-Content -Encoding utf8 probe.py
          python probe.py
